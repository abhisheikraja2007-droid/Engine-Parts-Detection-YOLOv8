<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Parts Detection</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #00d4ff; font-size: 2rem; }
        .subtitle { color: #888; margin-top: 5px; }
        
        .upload-section {
            background: #16213e;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        .drop-zone {
            border: 3px dashed #0f3460;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }
        .drop-zone input { display: none; }
        .drop-zone p { color: #888; margin: 10px 0; }
        .btn {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            color: #000;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #0f3460; color: #eee; }
        
        .player-section { display: none; }
        .player-section.active { display: block; }
        
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #videoCanvas { width: 100%; height: auto; display: block; }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .seek-bar { flex: 1; min-width: 200px; }
        .time-display { color: #888; font-family: monospace; }
        
        .counts-panel {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #0f3460;
        }
        .counts-title { color: #00d4ff; margin-bottom: 10px; font-weight: 600; }
        .counts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .count-item {
            background: #0f3460;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .count-label { color: #888; font-size: 0.85rem; }
        .count-value { font-size: 1.5rem; font-weight: 700; color: #00d4ff; }
        
        .status {
            padding: 10px 15px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .status.success { background: rgba(0, 200, 100, 0.2); color: #00c864; border: 1px solid #00c864; }
        .status.error { background: rgba(255, 80, 80, 0.2); color: #ff5050; border: 1px solid #ff5050; }
        .status.info { background: rgba(0, 212, 255, 0.2); color: #00d4ff; border: 1px solid #00d4ff; }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            width: 0%;
            transition: width 0.1s;
        }
        
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .controls { flex-direction: column; }
            .seek-bar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Engine Parts Detection</h1>
            <p class="subtitle">Upload a video → Real-time detection with bounding boxes</p>
        </header>
        
        <!-- Upload Section -->
        <div class="upload-section" id="uploadSection">
            <h3>📁 Upload Video</h3>
            <div class="drop-zone" id="dropZone">
                <input type="file" id="fileInput" accept="video/*">
                <p>📹 Drag & drop video file here, or click to browse</p>
                <p style="font-size: 0.85rem; color: #666;">Supports: MP4, AVI, MOV, MKV</p>
            </div>
            <div id="uploadStatus"></div>
            <button class="btn" id="processBtn" disabled>🚀 Process Video</button>
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        
        <!-- Player Section -->
        <div class="player-section" id="playerSection">
            <div class="video-wrapper">
                <canvas id="videoCanvas"></canvas>
                <div class="overlay" id="overlay"></div>
            </div>
            
            <div class="controls">
                <button class="btn btn-secondary" id="playBtn">▶ Play</button>
                <button class="btn btn-secondary" id="pauseBtn">⏸ Pause</button>
                <button class="btn btn-secondary" id="stopBtn">⏹ Stop</button>
                <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0">
                <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            </div>
            
            <div class="counts-panel">
                <div class="counts-title">📊 Detection Counts</div>
                <div class="counts-grid" id="countsGrid">
                    <div class="count-item">
                        <div class="count-label">Crankshaft</div>
                        <div class="count-value" id="countCrankshaft">0</div>
                    </div>
                    <div class="count-item">
                        <div class="count-label">Piston</div>
                        <div class="count-value" id="countPiston">0</div>
                    </div>
                    <div class="count-item">
                        <div class="count-label">Cylinder Block</div>
                        <div class="count-value" id="countCylinderBlock">0</div>
                    </div>
                    <div class="count-item">
                        <div class="count-label">Connecting Rod</div>
                        <div class="count-value" id="countConnectingRod">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const uploadSection = document.getElementById('uploadSection');
        const playerSection = document.getElementById('playerSection');
        const uploadStatus = document.getElementById('uploadStatus');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const videoCanvas = document.getElementById('videoCanvas');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const countsGrid = document.getElementById('countsGrid');
        
        // State
        let ws = null;
        let videoPath = null;
        let isPlaying = false;
        let totalFrames = 0;
        let currentFrame = 0;
        const ctx = videoCanvas.getContext('2d');
        
        // Count elements
        const countElements = {
            crankshaft: document.getElementById('countCrankshaft'),
            piston: document.getElementById('countPiston'),
            cylinder_block: document.getElementById('countCylinderBlock'),
            connecting_rod: document.getElementById('countConnectingRod')
        };
        
        // Drag & Drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) {
                handleFile(file);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        });
        
        function handleFile(file) {
            uploadStatus.innerHTML = `<div class="status info">Uploading ${file.name}...</div>`;
            progressFill.style.width = '0%';
            
            const formData = new FormData();
            formData.append('file', file);
            
            fetch('/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if (data.path) {
                        videoPath = data.path;
                        uploadStatus.innerHTML = `<div class="status success">✅ Loaded: ${data.filename}</div>`;
                        processBtn.disabled = false;
                    }
                })
                .catch(() => {
                    uploadStatus.innerHTML = `<div class="status error">Upload failed</div>`;
                });
        }
        
        // Process Video
        processBtn.addEventListener('click', () => {
            if (!videoPath) return;
            
            uploadSection.style.display = 'none';
            playerSection.classList.add('active');
            
            connectWebSocket();
        });
        
        // WebSocket
        function connectWebSocket() {
            ws = new WebSocket(`ws://${location.host}/ws/detect`);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                ws.send(JSON.stringify({
                    type: 'process_video',
                    path: videoPath
                }));
            };
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed');
                setTimeout(connectWebSocket, 2000); // Reconnect
            };
            
            ws.onerror = (err) => console.error('WS error:', err);
        }
        
        function handleMessage(msg) {
            switch (msg.type) {
                case 'video_info':
                    totalFrames = msg.total_frames;
                    seekBar.max = totalFrames;
                    updateTimeDisplay(0, totalFrames);
                    break;
                    
                case 'frame':
                    currentFrame = msg.frame_num;
                    seekBar.value = currentFrame;
                    updateTimeDisplay(currentFrame, totalFrames);
                    renderFrame(msg.frame);
                    updateCounts(msg.counts);
                    break;
                    
                case 'frame_result':
                    renderFrame(msg.frame);
                    updateCounts(msg.counts);
                    break;
                    
                case 'video_loop':
                    currentFrame = 0;
                    seekBar.value = 0;
                    break;
                    
                case 'error':
                    showStatus(msg.message, 'error');
                    break;
            }
        }
        
        function renderFrame(base64) {
            const img = new Image();
            img.onload = () => {
                // Set canvas size to video size
                videoCanvas.width = img.width;
                videoCanvas.height = img.height;
                ctx.drawImage(img, 0, 0);
            };
            img.src = 'data:image/jpeg;base64,' + base64;
        }
        
        function updateCounts(counts) {
            for (const [key, el] of Object.entries(countElements)) {
                el.textContent = counts[key] || 0;
            }
        }
        
        function updateTimeDisplay(current, total) {
            const fmt = (f) => {
                const m = Math.floor(f / 60);
                const s = Math.floor(f % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            };
            timeDisplay.textContent = `${fmt(current)} / ${fmt(total)}`;
        }
        
        // Controls
        playBtn.onclick = () => { isPlaying = true; };
        pauseBtn.onclick = () => { isPlaying = false; };
        stopBtn.onclick = () => { 
            isPlaying = false;
            currentFrame = 0;
            seekBar.value = 0;
        };
        
        seekBar.oninput = () => {
            currentFrame = parseInt(seekBar.value);
            updateTimeDisplay(currentFrame, totalFrames);
            // Could send seek command to server
        };
        
        // Resize handler
        window.addEventListener('resize', () => {
            // Canvas auto-sizes via CSS
        });
    </script>
</body>
</html>
